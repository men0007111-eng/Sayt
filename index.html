<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Left SIGN UP -->
        <div class="left-box">
            <h2>Sign Up</h2>

            <form>
                <input type="text" placeholder="ACE" required>
                <input type="email" placeholder="email@gmail.com" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>

                <label class="terms">
                    <input type="checkbox"> I accept the terms & conditions
                </label>

                <button class="signup-btn">Sign Up</button>
            </form>

            <div class="social-icons">
                <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828843.png">
            </div>
        </div>

        <!-- Right LOGIN -->
        <div class="right-box">
            <h2>Already have an account?</h2>
            <p>Login to your account!</p>

            <button class="login-btn">Login</button>
        </div>

    </div>

</body>
</html>

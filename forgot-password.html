<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parol tiklash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 330px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #005ec4;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Parolni tiklash</h2>
    <p>Email manzilingizni kiriting, sizga tiklash havolasi yuboriladi.</p>

    <form action="/forgot" method="POST">
    <input type="email" name="email" placeholder="Email kiriting..." required>
    <button type="submit">Havolani yuborish</button>
</form>
        <a class="muted-link" href="index.html">orqaga qaytish</a>
</div>

</body>
</html>
